# vulnpipe configuration for the OWASP Benchmark corpus (main corpus).
# Same as config.yaml, but findings/metrics/figures go to owasp/ subfolders
# so the Juliet results stay intact. Use: vulnpipe --config config.owasp.yaml ...

# Target CWEs (Common Weakness Enumeration).
cwes:
  - "89"   # SQL Injection
  - "22"   # Path Traversal

paths:
  data: "data"          # raw downloads (gitignored)
  corpus: "corpus"      # *.jsonl ground-truth outputs (committed)
  findings: "findings/owasp"  # per-detector outputs (gitignored)
  metrics: "metrics/owasp"    # *.csv (gitignored)
  figures: "figures/owasp"    # *.png (gitignored)

corpus:
  seed: 42              # deterministic sampling
  context_lines: 20     # +- lines of context around the extracted method
  juliet:
    # NIST Juliet Test Suite for Java, v1.3 (SARD).
    url: "https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-java-v1-3.zip"
    archive_name: "juliet-java-1.3.zip"
    # Balanced sample sizes (per the proposal: ~250 vulnerable + ~250 safe).
    n_vulnerable: 250
    n_safe: 250
    # Map each canonical (thesis) CWE to the Juliet file prefixes that
    # realise it. Juliet Java has no CWE22 dir — Path Traversal is split
    # into CWE23 (relative) + CWE36 (absolute), both children of CWE-22.
    # The corpus keeps the canonical id ("22"/"89") as ground truth.
    cwe_map:
      "89": ["89"]
      "22": ["23", "36"]
  owasp:
    dir: "owasp-benchmark"   # data/owasp-benchmark (sparse clone, see corpus/owasp.py)
  defects4j:
    # Validation set — ingestion deferred (see plan). Config reserved.
    n_bugs: 50

sast:
  pmd:
    image: "pmdcode/pmd:7.25.0"   # pinned for reproducibility
    # Variants (vanilla = built-in security.xml; custom = rulesets/pmd_cwe89_cwe22.xml)
    # and their rule->CWE maps are defined in vulnpipe.sast.pmd.
  semgrep:
    image: "semgrep/semgrep:1.103.0"   # pinned; "latest" drifts past it
    # Taint-mode ruleset rulesets/semgrep_cwe89_cwe22.yml (sources/sinks/
    # sanitizers). rule->CWE map lives in vulnpipe.sast.semgrep.
  # The three tools below analyse a compiled copy of the corpus
  # (vulnpipe.sast.project), built in this container.
  build:
    image: "maven:3.9.9-eclipse-temurin-17"
  # findsecbugs: SpotBugs 4.10.4 + FindSecBugs 1.14.0, the versions and the
  #   profile (effort Max, threshold Low) of the benchmark's own pom.xml.
  # codeql: CLI 2.27.4 with its default code-scanning suite; the bundle is
  #   unpacked in data/tools/codeql (see vulnpipe.sast.codeql).
  sonarqube:
    image: "sonarqube:10.7.0-community"   # default "Sonar way" profile; hotspots count as alerts

llm:
  # Stubbed this increment. Real local backends (Ollama) wired later.
  temperature: 0.0
  runs_per_snippet: 3   # majority vote
  strategies: ["zero-shot", "cot", "few-shot", "static-augmented"]

metrics:
  bootstrap_resamples: 1000
  alpha: 0.05
