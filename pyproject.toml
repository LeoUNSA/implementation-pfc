[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnpipe"
version = "0.1.0"
description = "SAST vs. LLMs for automated CWE-89/CWE-22 vulnerability detection in Java, with a hybrid pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leonardo Montoya Choque" }]

# Increment 1 (scaffold + corpus + metrics) dependencies only.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.21",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed in their own later phases — see the plan's "Deferred" section.
figures = ["matplotlib>=3.7", "seaborn>=0.13", "matplotlib-venn>=0.11"]
llm = ["openai>=1.0", "ollama>=0.3"]
ml = ["torch>=2.1", "transformers>=4.38"]
dev = ["pytest>=8.0"]

[project.scripts]
vulnpipe = "vulnpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
